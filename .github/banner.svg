<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Subrails — Application Layer</title>
  <desc id="desc">A restrained editorial-style banner for Subrails, showing recurring payment rails, delegated authorization, SDK, indexer and reference app.</desc>

  <!-- Warm, deliberately non-gradient palette -->
  <rect width="1600" height="500" fill="#F3EEE5"/>

  <!-- subtle paper-like structure -->
  <path d="M0 405H1600" stroke="#D8D0C3" stroke-width="1"/>
  <path d="M0 88H1600" stroke="#E2DCD2" stroke-width="1"/>

  <!-- left identity block -->
  <g transform="translate(88 78)">
    <rect x="0" y="0" width="430" height="344" rx="18" fill="#17262A"/>
    <path d="M32 286H398" stroke="#526B68" stroke-width="2"/>
    <text x="34" y="70" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#C9D3CD">STELLAR / SOROBAN</text>
    <text x="32" y="154" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#F7F1E8">SUBRAILS</text>
    <text x="35" y="194" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="2" fill="#D46B4B">APPLICATION LAYER</text>

    <!-- small hand-drawn-ish rail mark -->
    <g transform="translate(34 228)" fill="none" stroke="#E8B36D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 20H75"/>
      <path d="M0 38H75"/>
      <circle cx="16" cy="29" r="6" fill="#E8B36D" stroke="none"/>
      <circle cx="58" cy="29" r="6" fill="#E8B36D" stroke="none"/>
      <path d="M92 29H135"/>
      <path d="M121 18L135 29L121 40"/>
    </g>
    <text x="34" y="322" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#AEBBB5">SDK  ·  INDEXER  ·  REFERENCE APP</text>
  </g>

  <!-- right conceptual flow -->
  <g transform="translate(610 74)">
    <text x="0" y="34" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#69706E">RECURRING PAYMENTS, WITHOUT CUSTODY</text>
    <text x="0" y="82" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#17262A">Authorize once. Pull when due.</text>
    <text x="0" y="116" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5B625F">A TypeScript application layer around Stellar Protocol 27.</text>

    <!-- timeline / rail -->
    <g transform="translate(0 174)">
      <path d="M30 44H850" stroke="#B9B1A5" stroke-width="3"/>
      <path d="M30 64H850" stroke="#B9B1A5" stroke-width="3"/>

      <!-- subscriber -->
      <circle cx="78" cy="54" r="28" fill="#D46B4B"/>
      <path d="M68 55h20M78 45v20" stroke="#F8EFE5" stroke-width="3" stroke-linecap="round"/>
      <text x="48" y="111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#343B39">SUBSCRIBER</text>

      <!-- mandate -->
      <circle cx="286" cy="54" r="28" fill="#E8B36D"/>
      <path d="M274 47h24M274 55h24M274 63h17" stroke="#17262A" stroke-width="3" stroke-linecap="round"/>
      <text x="244" y="111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#343B39">MANDATE</text>

      <!-- sdk -->
      <circle cx="500" cy="54" r="28" fill="#6E8B87"/>
      <path d="M488 48l12-8 12 8v14l-12 8-12-8z" fill="none" stroke="#F5EFE7" stroke-width="2.5"/>
      <text x="478" y="111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#343B39">SDK</text>

      <!-- indexer -->
      <circle cx="704" cy="54" r="28" fill="#526B68"/>
      <path d="M692 47h24v17h-24zM697 43h14M697 69h14" fill="none" stroke="#F5EFE7" stroke-width="2.5"/>
      <text x="675" y="111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#343B39">INDEXER</text>

      <!-- app endpoint -->
      <circle cx="850" cy="54" r="28" fill="#17262A"/>
      <path d="M838 54h24M850 42v24" stroke="#E8B36D" stroke-width="3" stroke-linecap="round"/>
      <text x="825" y="111" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#343B39">APP</text>
    </g>

    <!-- lower feature notes -->
    <g transform="translate(0 344)">
      <rect x="0" y="0" width="255" height="58" rx="10" fill="#E7E0D5"/>
      <text x="20" y="24" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#69706E">POLICY</text>
      <text x="20" y="44" font-family="Inter, Arial, sans-serif" font-size="14" fill="#17262A">cap · cadence · expiry</text>

      <rect x="275" y="0" width="255" height="58" rx="10" fill="#E7E0D5"/>
      <text x="295" y="24" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#69706E">DATA</text>
      <text x="295" y="44" font-family="Inter, Arial, sans-serif" font-size="14" fill="#17262A">events · history · API</text>

      <rect x="550" y="0" width="300" height="58" rx="10" fill="#DDE5E0"/>
      <text x="570" y="24" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#526B68">NETWORK</text>
      <text x="570" y="44" font-family="Inter, Arial, sans-serif" font-size="14" fill="#17262A">Stellar testnet · CAP-71</text>
    </g>
  </g>

  <!-- tiny footer mark -->
  <text x="88" y="462" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8B857D">SUBRAILS / SDK + INDEXER + WEB</text>
  <text x="1512" y="462" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8B857D">STELLAR</text>
</svg>

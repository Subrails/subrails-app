packages:
  - "packages/*"
  - "apps/*"
  - "indexer"

# Build-script approvals. All transitive native build scripts are denied:
# the extension-based wallet modules do not need them, and prebuilt JS
# fallbacks exist for the rest.
allowBuilds:
  '@reown/appkit': false
  '@stellar/stellar-sdk': false
  blake-hash: false
  bufferutil: false
  protobufjs: false
  secp256k1: false
  tiny-secp256k1: false
  usb: false
  utf-8-validate: false
